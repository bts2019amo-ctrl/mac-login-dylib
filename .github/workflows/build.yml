name: Build macOS Dylib

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dynamic library
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/arm64 build/x86_64
          for ARCH in arm64 x86_64; do
            clang -arch "$ARCH" -dynamiclib \
              -framework Cocoa \
              -fobjc-arc \
              -fvisibility=hidden \
              -mmacosx-version-min=12.0 \
              -o "build/$ARCH/libMacLogin.dylib" \
              src/MacLogin.m
          done
          lipo -create \
            build/arm64/libMacLogin.dylib \
            build/x86_64/libMacLogin.dylib \
            -output build/libMacLogin.dylib
          file build/libMacLogin.dylib
          nm -gU build/libMacLogin.dylib | grep MLD_ShowLogin

      - name: Package release artifact
        run: |
          cp README.md build/README.md
          ditto -c -k --keepParent build MacLogin-dylib-macos.zip

      - name: Upload compiled Dylib
        uses: actions/upload-artifact@v4
        with:
          name: MacLogin-dylib-macos
          path: |
            build/libMacLogin.dylib
            MacLogin-dylib-macos.zip
          if-no-files-found: error
